<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b0d">
<title>For You ♡</title>
<style>
:root{--gold:#e9d2ad;--wine:#68151f;--ink:#100b0d;--paper:#f7eddf}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:var(--gold)}
body{background:#100b0d;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
.screen{min-height:100svh;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.bg{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(ellipse at 12% 42%,rgba(151,70,26,.36),transparent 28%),
 radial-gradient(ellipse at 82% 28%,rgba(18,44,70,.55),transparent 34%),
 linear-gradient(115deg,#1b0d0b,#050609 60%,#11111a)}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,.1))}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:clamp(18px,3vw,38px) clamp(20px,5vw,76px);font-size:clamp(14px,1.3vw,18px);letter-spacing:.16em}
.brand{font-style:italic;font-size:clamp(23px,2.5vw,35px);letter-spacing:0;direction:ltr}
.nav{display:flex;gap:clamp(14px,3vw,42px);direction:ltr}
.nav span{white-space:nowrap}
.hero{width:min(100%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(45px,10vh,100px)}
.kicker{font-size:clamp(16px,1.5vw,21px);letter-spacing:.19em;line-height:1.6;direction:ltr;margin-bottom:24px}
.ornament{display:flex;align-items:center;gap:16px;margin-bottom:clamp(28px,6vh,60px)}
.ornament i{display:block;width:clamp(45px,7vw,95px);height:1px;background:#c6a67f}
.heart{font-size:21px}
.envelope-button{position:relative;width:min(76vw,560px);aspect-ratio:1.58;border:0;background:transparent;padding:0;filter:drop-shadow(0 22px 22px #0009);transition:transform .35s ease}
.envelope-button:hover{transform:translateY(-5px)}
.envelope{position:absolute;inset:0;background:linear-gradient(145deg,#241a1c,#0d0b0e 65%,#2a1719);border:1px solid #7e5c51;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);border-radius:5px;overflow:hidden}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 47%,#50302d 48%,#100b0d 49%),linear-gradient(35deg,transparent 49%,#5b3831 50%,#151012 51%);opacity:.85}
.flap{position:absolute;inset:0 0 auto;height:60%;background:linear-gradient(155deg,#382528,#151013 70%);clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:1px solid #b18b69;transform-origin:top;transition:transform 1s cubic-bezier(.2,.75,.25,1);z-index:3}
.seal{position:absolute;z-index:4;left:50%;top:57%;transform:translate(-50%,-50%);width:clamp(56px,7vw,80px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#b43d47,#610a15 65%,#29050a);border:3px double #c68b76;box-shadow:0 4px 12px #000b;color:#f1c6b3;font-size:clamp(24px,3vw,34px);transition:opacity .3s,transform .5s;z-index:4}
.paper-peek{position:absolute;inset:9% 8% 4%;background:var(--paper);border-radius:3px;z-index:1;transform:translateY(25%);transition:transform 1s ease}
.hint{margin-top:clamp(25px,5vh,45px);font-size:clamp(18px,2vw,25px);letter-spacing:.14em;direction:ltr}
.chevron{font-size:30px;margin-top:10px}
.password-screen{position:fixed;inset:0;z-index:20;background:rgba(5,4,6,.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:22px}
.password-card{width:min(100%,390px);text-align:center;border:1px solid #8c6a4f;background:linear-gradient(145deg,#201517,#09080b);padding:34px 25px;border-radius:12px;box-shadow:0 20px 70px #0009}
.password-card h1{font-size:28px;font-weight:normal;margin:0 0 10px}
.password-card p{color:#cdb79c;line-height:1.7;margin:0 0 22px}
.password-card input{width:100%;padding:14px 15px;border:1px solid #795a4d;border-radius:7px;background:#0d0b0d;color:#fff;text-align:center;outline:none;direction:ltr}
.gold-button{margin-top:14px;width:100%;border:1px solid #d0b18b;background:linear-gradient(100deg,#6e1821,#301016);color:#f7e4c8;border-radius:7px;padding:13px}
.error{min-height:22px;color:#f0a1a1;font-size:14px;margin-top:8px}
.letter-screen{display:none;min-height:100svh;padding:90px 16px 45px;align-items:center;justify-content:center}
.letter{width:min(100%,760px);background:linear-gradient(135deg,#fff7ea,#efe0ca);color:#38201d;padding:clamp(24px,6vw,64px);box-shadow:0 22px 90px #0009;border:1px solid #c8a77f;position:relative;line-height:2.05;font-size:clamp(16px,1.7vw,20px);white-space:pre-wrap;overflow-wrap:anywhere}
.letter:before{content:"";position:absolute;inset:10px;border:1px solid #d7bfa0;pointer-events:none}
.letter-title{text-align:center;font-size:clamp(25px,4vw,39px);font-style:italic;margin:0 0 25px;color:#6d1b26;position:relative}
.message{position:relative;direction:rtl;text-align:right;font-family:Arial,Tahoma,sans-serif}
.letter-footer{text-align:center;color:#7a2730;font-size:28px;margin-top:24px;position:relative}
.back{display:block;margin:22px auto 0;border:1px solid #c7a77f;background:transparent;color:var(--gold);padding:10px 20px;border-radius:30px}
body.open .flap{transform:rotateX(180deg);opacity:.15}
body.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
body.open .paper-peek{transform:translateY(-4%)}
@media(max-width:600px){
 .top{padding:18px 18px}.nav{gap:12px;font-size:12px}.nav span:nth-child(3){display:none}
 .hero{padding-top:52px}.envelope-button{width:min(88vw,470px)}
 .kicker{letter-spacing:.12em}.letter-screen{padding-top:82px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bg"></div>
<section class="screen" id="home">
  <header class="top"><div class="brand">For You ♡</div><nav class="nav"><span>Home</span><span>Message</span><span>About</span><span>♡</span></nav></header>
  <main class="hero">
    <div class="kicker">A little letter...<br>from my heart to yours</div>
    <div class="ornament"><i></i><span class="heart">♥</span><i></i></div>
    <button class="envelope-button" id="openEnvelope" aria-label="افتح الظرف">
      <div class="envelope"></div><div class="paper-peek"></div><div class="flap"></div><div class="seal">♡</div>
    </button>
    <div class="hint">Click to open</div><div class="chevron">⌄</div>
  </main>
</section>
<section class="letter-screen" id="letterScreen">
  <article class="letter">
    <h1 class="letter-title">For You ♡</h1>
    <div class="message" id="message"></div>
    <div class="letter-footer">♡ ∞ ♡</div>
  </article>
  <button class="back" id="backButton">العودة إلى الظرف</button>
</section>
<div class="password-screen" id="passwordScreen">
  <form class="password-card" id="passwordForm">
    <h1>رسالة ليكي ♡</h1><p>في رسالة صغيرة من قلبي لقلبك.<br>اكتبي كلمة السر عشان تفتحيها.</p>
    <input id="password" type="password" placeholder="Enter password" autocomplete="off" aria-label="كلمة السر">
    <button class="gold-button" type="submit">افتحي رسالتك ♥</button>
    <div class="error" id="error" aria-live="polite"></div>
  </form>
</div>
<audio id="song" src="assets/song.mp3" loop preload="auto"></audio>
<script>
const PASSWORD = "my wife";
const messageText = `مش عارف اوصفلك ابدا انا ايه حاسس بايه منك بجد شويه مشاعر كدا متخلطه فاهمه ال هو حسيت برجوع مشاعرك بدت تظهرلي وتكون فياضة  زي زمان مش المقصد انك دلوقت يعني ما بتحبي لالا ال اقصده ايه انا عارف انك مريتي بضغوطات وامور ومسؤوليات وانشغالات خلتك تنسى نفسك ومشاعرك تقل ومش قادرة تعبري كل دا انا عارف انه غصب عنك اوي ولا عمري لمتك لحظه،، لما شفتك اليومين دول معاية فرحت اوي فرحت اوي بقول شيماء رجعتلي 😭 شعور غريب وحلو اوي لما ال بتحبه يعبرلك ويقولك هو قد ايه بيحبك وانا بحبك موت بعششقك مش بس بحبك لما بسمعك واشوفك حتى لو مده صغيرة بتكون أجمل حاجه في يومي ❤
انتي اختياري وهدية عمري، وسبب سعادتي كلها.. 
بجد معاكي بحس ان الدنيا اجمل.. 
انتي بجد ادماني يا رب افضل دايما شايفك كدا مبسوطة معاية واسعدك دايما انا بحبك اويييي انتي عشقي وروحي وحياتي وكل ما ليا مستنى وبعمل للوقت ال تكوني فية جنبي وفي حضنى بحببك اوييي وكل لحظة معاكي احسن لحظات حياتي..🥹💋🙈❤
وانا مش بس بحبك انتي احتياج ،، احتياج في كل لحظه ،  محتاج ضحكتك، صوتك، وقلبك واهمهم وانتي عارفة🫦🙈 
انتي اجمل حاجه حصلت في حياتي يا حبيبتي مستنى نكمل كل احلامنا مع بعض بس انا عن نفسي انتي حلمي الوحيد ومش محتاج حاجه تاني غيرك يا روحي🥹🩷🩷🩷`;
document.getElementById("message").textContent = messageText;
const passScreen = document.getElementById("passwordScreen");
const passInput = document.getElementById("password");
document.getElementById("passwordForm").addEventListener("submit", e => {
  e.preventDefault();
  if (passInput.value === PASSWORD) {
    passScreen.style.display = "none";
    passInput.value = "";
    document.getElementById("error").textContent = "";
  } else {
    document.getElementById("error").textContent = "كلمة السر مش صحيحة، جربي تاني ❤️";
  }
});
document.getElementById("openEnvelope").addEventListener("click", async () => {
  document.body.classList.add("open");
  const song = document.getElementById("song");
  try { await song.play(); } catch (_) {}
  setTimeout(() => {
    document.getElementById("home").style.display = "none";
    document.getElementById("letterScreen").style.display = "flex";
    window.scrollTo({top:0,behavior:"smooth"});
  }, 750);
});
document.getElementById("backButton").addEventListener("click", () => {
  document.getElementById("letterScreen").style.display = "none";
  document.getElementById("home").style.display = "flex";
  document.body.classList.remove("open");
});
</script>
</body>
</html>
